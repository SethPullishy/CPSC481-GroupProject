<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Calgary Transit Directions</title>

    <style>
      /* Make page fill the window and use flex layout */
      html,
      body {
        height: 100%;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        font-family: Roboto, Arial, sans-serif;
      }

      /* Map takes the top part */
      #map {
        flex: 1;
        width: 100%;
      }

      /* Directions panel at the bottom */
      #directions-panel {
        width: 100%;
        max-height: 250px;
        overflow-y: auto;
        padding: 10px;
        box-sizing: border-box;
        border-top: 1px solid #ccc;
        background-color: #fff;
        font-size: 14px;
      }

      .controls {
        margin-top: 10px;
        border: 1px solid transparent;
        border-radius: 2px 0 0 2px;
        box-sizing: border-box;
        -moz-box-sizing: border-box;
        height: 32px;
        outline: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      }

      #origin-input,
      #destination-input {
        background-color: #fff;
        font-size: 15px;
        font-weight: 300;
        margin-left: 12px;
        padding: 0 11px 0 13px;
        text-overflow: ellipsis;
        width: 220px;
      }

      #origin-input:focus,
      #destination-input:focus {
        border-color: #4d90fe;
      }
    </style>
  </head>
  <body>
    <!-- Hidden container. JS moves these controls onto the map UI -->
    <div style="display: none">
      <input
        id="origin-input"
        class="controls"
        type="text"
        placeholder="Enter an origin location"
      />

      <input
        id="destination-input"
        class="controls"
        type="text"
        placeholder="Enter a destination location"
      />
    </div>

    <!-- Map area -->
    <div id="map"></div>

    <!-- Text directions area (this is where it tells you which bus to take) -->
    <div id="directions-panel"></div>

    <script>
      // Requires the Places library. We load it in the script tag at the bottom.

      function initMap() {
        // Center on Calgary
        const map = new google.maps.Map(document.getElementById("map"), {
          mapTypeControl: false,
          center: { lat: 51.0447, lng: -114.0719 },
          zoom: 13,
        });

        new AutocompleteDirectionsHandler(map);
      }

      class AutocompleteDirectionsHandler {
        map;
        originPlaceId;
        destinationPlaceId;
        travelMode;
        directionsService;
        directionsRenderer;

        constructor(map) {
          this.map = map;
          this.originPlaceId = "";
          this.destinationPlaceId = "";
          // Transit only
          this.travelMode = google.maps.TravelMode.TRANSIT;

          this.directionsService = new google.maps.DirectionsService();
          this.directionsRenderer = new google.maps.DirectionsRenderer();

          // Draw route on map
          this.directionsRenderer.setMap(map);
          // And send written directions into the panel div
          this.directionsRenderer.setPanel(
            document.getElementById("directions-panel")
          );

          const originInput = document.getElementById("origin-input");
          const destinationInput = document.getElementById("destination-input");

          const originAutocomplete = new google.maps.places.Autocomplete(
            originInput,
            { fields: ["place_id"] }
          );
          const destinationAutocomplete = new google.maps.places.Autocomplete(
            destinationInput,
            { fields: ["place_id"] }
          );

          this.setupPlaceChangedListener(originAutocomplete, "ORIG");
          this.setupPlaceChangedListener(destinationAutocomplete, "DEST");

          // Put text boxes on the top left of the map
          this.map.controls[google.maps.ControlPosition.TOP_LEFT].push(
            originInput
          );
          this.map.controls[google.maps.ControlPosition.TOP_LEFT].push(
            destinationInput
          );
        }

        setupPlaceChangedListener(autocomplete, mode) {
          autocomplete.bindTo("bounds", this.map);
          autocomplete.addListener("place_changed", () => {
            const place = autocomplete.getPlace();

            if (!place.place_id) {
              window.alert("Please select an option from the dropdown list.");
              return;
            }

            if (mode === "ORIG") {
              this.originPlaceId = place.place_id;
            } else {
              this.destinationPlaceId = place.place_id;
            }

            this.route();
          });
        }

        route() {
          if (!this.originPlaceId || !this.destinationPlaceId) {
            return;
          }

          const me = this;

          this.directionsService.route(
            {
              origin: { placeId: this.originPlaceId },
              destination: { placeId: this.destinationPlaceId },
              travelMode: this.travelMode, // always TRANSIT
            },
            (response, status) => {
              if (status === "OK") {
                me.directionsRenderer.setDirections(response);

                // Manually control how far we zoom in
                const route = response.routes[0];

                const bounds = new google.maps.LatLngBounds();
                route.legs.forEach((leg) => {
                  bounds.extend(leg.start_location);
                  bounds.extend(leg.end_location);
                });
                me.map.fitBounds(bounds);

                google.maps.event.addListenerOnce(me.map, "idle", () => {
                  if (me.map.getZoom() < 12) {
                    me.map.setZoom(12);
                  }
                  if (me.map.getZoom() > 16) {
                    me.map.setZoom(15);
                  }
                });
              } else {
                window.alert("Transit directions request failed: " + status);
              }
            }
          );
        }
      }

      window.initMap = initMap;
    </script>

    <!-- Your Maps JS API load with your own key -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDTY4AWYk5AFdoK9YdtxV1SEXACjd7CYAI&callback=initMap&libraries=places&v=weekly"
      defer
    ></script>
  </body>
</html>
