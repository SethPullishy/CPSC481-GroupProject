<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Screen</title>
</head>


<body>
    <div class="top-bar">
        <img src="../images/yyc_logo.png" alt="Calgary Logo">
        <img src="../images/map_icon.png" alt="Map Pin Icon">
        <h3 class="top-bar-text">Brentwood Station</h3>
        <h3 class="top-bar-text">12:55 PM Friday, October 31</h3> 
    </div>


    <div class="main-content-and-side-bar">
        <div class="side-bar">
            <a href="../HTML Code/home_screen.html" class="side-bar-option">
                <img src="../images/home_icon.png" alt="Home Icon">
                <h3>HOME</h3>
            </a>

            <a href="../HTML Code/check_route_screen.html" class="side-bar-option">
                <img src="../images/route_icon.png" alt="Route Icon">
                <h3>ROUTE</h3>
            </a>

            <a href="../HTML Code/schedule_screen.html" class="side-bar-option">
                <img src="../images/schedule_icon.png" alt="Schedule Icon">
                <h3>SCHEDULE</h3>
            </a>

            <a href="../HTML Code/help_screen.html" class="side-bar-option">
                <img src="../images/help_icon.png" alt="Help Icon">
                <h3>HELP</h3>
            </a>

            <a href="../HTML Code/language_screen.html" class="side-bar-option">
                <img src="../images/language_icon.png" alt="Language Icon">
                <h3>FR ∇</h3>
            </a>

            <a href="../HTML Code/adult_ticket_screen.html" class="side-bar-option">
                <img src="../images/back_icon.png" alt="Back Icon">
                <h3>BACK</h3>
            </a>
        </div>

        <div class="main-content">
            <div class="title-level">
                <img src="../images/weather_icon.png" alt="Weather Icon">
                <h1>How would you like to pay?</h1>
            </div>


            <div class="main-actions">
                <div class="total-cost">
                    <h2><b>Your Cart</b></h2>

                    <div class="cost-matrix">
                        <div class="cost-matrix-top-row">
                            <h3><b>QTY</b></h3>
                            <h3><b>ITEM</b></h3>
                            <h3><b>COST</b></h3>
                        </div>

                        <div class="cost-matrix-adult-row">
                            <h3>1</h3>
                            <h3>Adult Single Ticket</h3>
                            <h3>$3.80</h3>
                        </div>

                        <div class="cost-matrix-youth-row">
                            <h3>0</h3>
                            <h3>Youth Single Ticket</h3>
                            <h3>$0.00</h3>
                        </div>

                        <div class="cost-matrix-total-row">
                            <h3>1</h3>
                            <h3>Total Cost:</h3>
                            <h3>$3.80</h3>
                        </div>
                    </div>
                </div>

                <div class="payment-select">
                    <a href="card_screen.html" class="medium-button-container">
                        <h2>Credit/Debit Card</h2>
                    </a>
                    <a href="cash_coin_screen_5.html" class="medium-button-container">
                        <h2>Cash/Coins</h2>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
