<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Selection Screen</title>

        <style>
        body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        }

        .top-bar {
        overflow: hidden;
        background-color: #CC1330;
        }

        .top-bar a {
        float: left;
        color: #f2f2f2;
        text-align: center;
        padding: 14px 16px;
        font-size: 24px;

        }

</style>

</head>


<body>
        <!--Top bar: present on most screens-->
        <div class="top-bar">
            <img src="../images/yyc_logo.png" alt="Calgary Logo" width="200" style="float:left">

            <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px
            ">
                <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
                <a class="top-bar-text">Brentwood Station</a>
            </div>

            <a class="top-bar-text" style="float:right; margin-top: -55px" id="datetime"></a>

            <script>
                function updateClock() {
                    const now = new Date();
                    const time = now.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: true});
                    const date = now.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'});
                    document.getElementById('datetime').textContent = `${time} ${date}`;
                }
                updateClock();
                setInterval(updateClock, 1000);
            </script>
        </div>

        <!--Weather-->
        <div style="position: relative; width: 100%; min-height: 200px;">
            <div class="title-weather" style="
                position: absolute;
                top: 20px;
                right: 20px;
            ">
                <iframe title="Environment Canada Weather" width="296" height="191" src="https://weather.gc.ca/wxlink/wxlink.html?coords=51.046%2C-114.057&lang=e" allowtransparency="true" style="border: 0;"></iframe>
            </div>

            <div class="title-level" style="
                width: 100%;
                text-align: center;
                padding-top: 40px;
            ">
                <h1>Which Fare?</h1>
            </div>

        </div>


    <!--SideBar & 2 Buttons-->
    <div style="position: relative; width: 100%; min-height: 200px;">
        <!--SideBar-->
        <div class="main-content-and-side-bar" style="
            display: flex;
            width: 100%;
            max-width: 1900px;
            margin: 0 auto;
        ">

            <div class="side-bar" style="
                width: 150px;
                display: flex;
                flex-direction: column;
                border: 2px solid #ccc;
                background-color: #f0f0f0;
                padding-top: 0px;
            ">
                <a href="../HTML Code/home_screen.html" class="side-bar-option" style="text-decoration: none; text-align: center; padding: 10px 0; background-color: #ccc;">
                    <img src="../images/home_icon.png" alt="Home Icon" style="width: 40px; height: 40px;">
                    <h3 style="color: black; margin: 5px 0 0 0;">HOME</h3>
                </a>

                <a href="../HTML Code/check_route_screen.html" class="side-bar-option" style="text-decoration: none; text-align: center; padding: 10px 0; background-color: #ccc;">
                    <img src="../images/route_icon.png" alt="Route Icon" style="width: 40px; height: 40px;">
                    <h3 style="color: black; margin: 5px 0 0 0;">ROUTE</h3>
                </a>

                <a href="../HTML Code/schedule_screen.html" class="side-bar-option" style="text-decoration: none; text-align: center; padding: 10px 0; background-color: #ccc;">
                    <img src="../images/schedule_icon.png" alt="Schedule Icon" style="width: 40px; height: 40px;">
                    <h3 style="color: black; margin: 5px 0 0 0;">SCHEDULE</h3>
                </a>

                <a href="../HTML Code/help_screen.html" class="side-bar-option" style="text-decoration: none; text-align: center; padding: 10px 0; background-color: #ccc;">
                    <img src="../images/help_icon.png" alt="Help Icon" style="width: 40px; height: 40px;">
                    <h3 style="color: black; margin: 5px 0 0 0;">HELP</h3>
                </a>

                <a href="../HTML Code/language_screen.html" class="side-bar-option" style="text-decoration: none; text-align: center; padding: 10px 0; background-color: #ccc;">
                    <img src="../images/language_icon.png" alt="Language Icon" style="width: 40px; height: 40px;">
                    <h3 style="color: black; margin: 5px 0 0 0;">FR ∇</h3>
                </a>

                <a href="../HTML Code/home_screen.html" class="side-bar-option" style="text-decoration: none; text-align: center; padding: 10px 0; background-color: #ccc;">
                    <img src="../images/back_icon.png" alt="Back Icon" style="width: 40px; height: 40px;">
                    <h3 style="color: black; margin: 5px 0 0 0;">BACK</h3>
                </a>
            </div>
            <!--2 Buttons-->
            <div class="main-content" style="
                display: flex;
                flex-direction: column;
                flex-grow: 1;
                align-items: center;
                padding: 20px;
            ">
                <div style="
                    display: flex;
                    justify-content: center;
                    width: 100%;
                    max-width: 600px;
                    gap: 40px;
                ">
                    <a href="../HTML Code/adult_ticket_screen.html" class="large-button-container" style="
                        text-decoration: none;
                        flex: 1;
                        border: 2px solid #ccc;
                        padding: 15px;
                        text-align: center;
                        height: 400px;
                        background-color: #dddddd;
                    ">
                        <h2 style="color: black;">Adult</h2>
                        <h3 style="color: black;">For passengers aged between 18 and 64</h3>
                    </a>

                    <a href="../HTML Code/youth_ticket_screen.html" class="large-button-container" style="
                        text-decoration: none;
                        flex: 1;
                        border: 2px solid #ccc;
                        padding: 15px;
                        text-align: center;
                        height: 400px;
                        background-color: #dddddd;
                    ">
                        <h2 style="color: black;">Youth</h2>
                        <h3 style="color: black;">For passengers aged between 13 and 17</h3>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
