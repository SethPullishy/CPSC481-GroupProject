<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Error Screen</title>
</head>


<body>
    <div class="top-bar">
        <img src="../images/yyc_logo.png" alt="Calgary Logo">
        <img src="../images/map_icon.png" alt="Map Pin Icon">
        <h3 class="top-bar-text">Brentwood Station</h3>
        <h3 class="top-bar-text">12:55 PM Friday, October 31</h3> 
    </div>


    <div class="main-content-and-side-bar">
        <div class="side-bar">
            <a href="../HTML Code/home_screen.html" class="side-bar-option">
                <img src="../images/home_icon.png" alt="Home Icon">
                <h3>HOME</h3>
            </a>

            <a href="../HTML Code/check_route_screen.html" class="side-bar-option">
                <img src="../images/route_icon.png" alt="Route Icon">
                <h3>ROUTE</h3>
            </a>

            <a href="../HTML Code/schedule_screen.html" class="side-bar-option">
                <img src="../images/schedule_icon.png" alt="Schedule Icon">
                <h3>SCHEDULE</h3>
            </a>

            <a href="../HTML Code/help_screen.html" class="side-bar-option">
                <img src="../images/help_icon.png" alt="Help Icon">
                <h3>HELP</h3>
            </a>

            <a href="../HTML Code/language_screen.html" class="side-bar-option">
                <img src="../images/language_icon.png" alt="Language Icon">
                <h3>FR ∇</h3>
            </a>

            <a href="../HTML Code/payment_screen.html" class="side-bar-option">
                <img src="../images/back_icon.png" alt="Back Icon">
                <h3>BACK</h3>
            </a>
        </div>


        <div class="main-content">
            <div class="error-declaration">
                <h1>There has been an error with payment</h1>
                <h1>Please return to the payment screen to try again</h1>
                <a href="../HTML Code/payment_screen.html">
                    <img src="../images/back_icon.png">
                    <h3>RETURN TO PAYMENT SCREEN</h3>
                </a>
            </div>
            
        </div>
    </div>
</body>
</html>
