<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you!</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="thank-page">

  <div class="top-bar">
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span>Brentwood Station</span>

      <div class="weather-mini">
        <iframe
          src="https://widgets.commoninja.com/iframe/d0542a0e-2b72-4421-9c7d-d52b9fb80201"
          width="760"
          height="165"
          frameborder="0"
          scrolling="no">
        </iframe>
      </div>
    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
      const date = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <main class="thank-center">
    <div class="thank-card">
      <h1>Thank you for using Calgary Transit</h1>

      <p class="thank-subtext">
        This kiosk will return to the welcome screen in:
      </p>

      <h2 id="countdown" class="thank-countdown">3 seconds...</h2>
    </div>
  </main>

  <script>
    let timer = 3;
    const countdownElement = document.getElementById("countdown");

    const interval = setInterval(() => {
      timer--;
      countdownElement.textContent = `${timer} seconds...`;

      if (timer === 1) {
        countdownElement.textContent = "1 second...";
      }

      if (timer === 0) {
        clearInterval(interval);
        window.location.href = "../HTML Code/waiting_screen.html";
      }
    }, 1000);
  </script>

</body>
</html>
