<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank you!</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="thank-page">

  <div class="top-bar">
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span data-i18n="location.brentwood">Brentwood Station</span>

     <div class="weather-mini">
  <div id="ww_cc758efd500b8" 
       v="1.3" 
       loc="id" 
       a='{"t":"horizontal","lang":"en","sl_lpl":1,"ids":["wl3002"],
           "font":"Arial","sl_ics":"one_a","sl_sot":"celsius",
           "cl_bkg":"#FFFFFF00","cl_font":"rgba(255,255,255,1)",
           "cl_cloud":"#d4d4d4","cl_persp":"#2196F3",
           "cl_sun":"#FFC107","cl_moon":"#FFC107",
           "cl_thund":"#FF5722","el_nme":3,"el_phw":3,"el_whr":3}'>
    More forecasts: 
    <a href="https://oneweather.org/calgary/30_days/" 
       id="ww_cc758efd500b8_u" target="_blank">
       Calgary weather 30 days
    </a>
  </div>
  <script async src="https://app3.weatherwidget.org/js/?id=ww_cc758efd500b8"></script>
</div>


    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <main class="thank-center">
    <div class="thank-card">
      <h1 data-i18n="thank.card">Thank you for using Calgary Transit</h1>

      <p class="thank-subtext" data-i18n="thank.subtext">
        This kiosk will return to the welcome screen in:
      </p>

      <h2 id="countdown" class="thank-countdown" data-i18n="thank.countdown">3 seconds...</h2>
    </div>
  </main>

  <script>
    let timer = 3;
    const countdownElement = document.getElementById("countdown");

    const interval = setInterval(() => {
      timer--;
      countdownElement.textContent = `${timer} seconds...`;

      if (timer === 1) {
        countdownElement.textContent = "1 second...";
      }

      if (timer === 0) {
        clearInterval(interval);
        window.location.href = "../index.html";
      }
    }, 1000);
  </script>
  <script src="translate.js"></script>
</body>
</html>
