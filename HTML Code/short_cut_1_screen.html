<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Screen</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .top-bar {
            overflow: hidden;
            background-color: #CC1330;
        }

        .top-bar a {
            float: left;
            color: #f2f2f2;
            text-align: center;
            padding: 14px 16px;
            font-size: 24px;
        }

        .main-actions {
            display: flex;
            justify-content: center;
            width: 580px;
            height: 404px;
            margin: 0 auto;
            align-items: flex-start;
            gap: 20px;
            padding: 0px 0;
            border-style: solid;
            border-color: #a7a7a7;
            background-color: #f2f2f2;

        }

        .quantity-selection-widget{
            display: flex;
            justify-content: center;
            width: 80%;
            margin: 0 auto;
            align-items: flex-start;
            gap: 20px;
            padding: 20px 0;
        }

        .side-bar-option{
                text-decoration: none;
                text-align: center;
                padding: 10px 0;
                width: 80%;
                background-color: #ccc;
                margin-bottom: 10px;
        }
        .money-button{
            display: flex;
            justify-content: center;
            width: 500px;
            height: 200px;
            margin: 0 auto;
            align-items: flex-start;
            gap: 20px;
            padding: 10px 0;
            border-style: solid;
            border-color: #a7a7a7;
            background-color: #f2f2f2;
            text-decoration: none;
            align-items: center;
        }
        .return-button{
            display: flex;
            justify-content: center;
            width: 580px;
            height: 50px;
            margin: 0 auto;
            margin: 20px auto 0 auto;
            align-items: flex-start;
            gap: 20px;
            padding: 10px 0;
            border-style: solid;
            border-color: #f2f2f2;
            background-color: #d7d7d7;
            text-decoration: none;
            align-items: center;
        }

        .payment-select{
            margin-left: 100px;
            display: flex;
            flex-direction: column;
            gap: 50px;
            margin-top: 0px;
            text-decoration: none;
        }
        .cost-matrix-top-row{
            display: flex;
            flex-direction: row;
            gap: 190px;
        }

        .cost-matrix-A-row{
            display: flex;
            flex-direction: row;
            gap: 150px;
        }

        .cost-matrix-total-row{
            display: flex;
            flex-direction: row;
            gap: 150px;
            margin-bottom: 0%;
            margin-left: 235px;
        }

    </style>
</head>

<body>
    <div class="top-bar">
        <img src="../images/yyc_logo.png" alt="Calgary Logo" width="200" style="float:left">

        <div style="
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px
            ">
            <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
            <a class="top-bar-text">Brentwood Station</a>
        </div>

        <a class="top-bar-text" style="float:right; margin-top: -55px" id="datetime"></a>

        <script>
            function updateClock() {
                const now = new Date();
                const time = now.toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit', hour12: true});
                const date = now.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric'});
                document.getElementById('datetime').textContent = `${time} ${date}`;
            }
            updateClock();
            setInterval(updateClock, 1000);
        </script>
    </div>

    <div style="position: relative; width: 100%; min-height: 200px;">
        <div class="title-weather" style="
                position: absolute;
                top: 20px;
                right: 20px;
            ">
            <iframe title="Environment Canada Weather" width="296" height="191" src="https://weather.gc.ca/wxlink/wxlink.html?coords=51.046%2C-114.057&lang=e" allowtransparency="true" style="border: 0;"></iframe>
        </div>

        <div class="title-level" style="
                width: 100%;
                text-align: center;
                padding-top: 40px;
            ">
            <h1>How Would You Like To Pay?</h1>
        </div>

    </div>

<div style="position: relative; width: 100%; padding: 0;">

    <div class="main-content-and-side-bar" style="
        display: flex;
        width: 98%;
        max-width: 1900px;
        margin: 0 auto;
    ">

        <div class="side-bar" style="
            width: 120px;
            position: relative;
            top: -100px;

            display: flex;
            flex-direction: column;

            align-items: center;

            border: 2px solid #ccc;
            background-color: #f0f0f0;
            padding: 10px 0;
            flex-shrink: 0;
        ">
            <a href="../HTML Code/home_screen.html" class="side-bar-option">
                <img src="../images/home_icon.png" alt="Home Icon" style="width: 40px; height: 40px;">
                <h3 style="color: black; margin: 5px 0 0 0; font-size: 15px;">HOME</h3>
            </a>

            <a href="../HTML Code/check_route_screen.html" class="side-bar-option">
                <img src="../images/route_icon.png" alt="Route Icon" style="width: 40px; height: 40px;">
                <h3 style="color: black; margin: 5px 0 0 0; font-size: 15px;">ROUTE</h3>
            </a>

            <a href="../HTML Code/schedule_screen.html" class="side-bar-option">
                <img src="../images/schedule_icon.png" alt="Schedule Icon" style="width: 40px; height: 40px;">
                <h3 style="color: black; margin: 5px 0 0 0; font-size: 15px;">SCHEDULE</h3>
            </a>

            <a href="../HTML Code/help_screen.html" class="side-bar-option">
                <img src="../images/help_icon.png" alt="Help Icon" style="width: 40px; height: 40px;">
                <h3 style="color: black; margin: 5px 0 0 0; font-size: 15px;">HELP</h3>
            </a>

            <a href="../HTML Code/home_screen_fr.html" class="side-bar-option">
                <img src="../images/language_icon.png" alt="Language Icon" style="width: 40px; height: 40px;">
                <h3 style="color: black; margin: 5px 0 0 0; font-size: 15px;">Français</h3>
            </a>

            <a onclick="history.back()" class="side-bar-option">
                <img src="../images/back_icon.png" alt="Back Icon" style="width: 40px; height: 40px;">
                <h3 style="color: black; margin: 5px 0 0 0; font-size: 15px;">PREVIOUS</h3>
            </a>
        </div>
        <div style="
                    display: flex;
            justify-content: center;
            margin: 0 auto;
            align-items: flex-start;
            gap: 10px;
            padding: 0px 0;
        ">
        <div style="
        display: flex;
        flex-direction: column;
        ">
            <div class="main-actions">
                <div class="total-cost">
                    <h2><b>Your Cart</b></h2>

                    <div class="cost-matrix">
                        <div class="cost-matrix-top-row">
                            <h3><b>QTY</b></h3>
                            <h3><b>ITEM</b></h3>
                            <h3><b>COST</b></h3>
                        </div>

                        <div class="cost-matrix-A-row">
                            <h3>1</h3>
                            <h3>Adult Single Ticket </h3>
                            <h3>$3.80</h3>
                        </div>

                        <div class="cost-matrix-A-row">
                            <h3>0</h3>
                            <h3>Youth Single Ticket</h3>
                            <h3>$0.00</h3>
                        </div>
                            <hr style="width:100%">
                        <div class="cost-matrix-total-row">
                            <h3>Total Cost:</h3>
                            <h3>$3.80</h3>
                        </div>
                    </div>
                </div>
            </div>
        <a href="ticket_screen.html" class="return-button">
            <h2 style="color: black;">RETURN TO TICKET SELECTION</h2>
        </a>
        </div>
                <div class="payment-select">
                    <a href="card_screen.html" class="money-button">
                        <h2 style="color: black;">Credit/Debit Card</h2>
                    </a>
                    <a href="cash_coin_screen.html" class="money-button">
                        <h2 style="color: black;">Cash/Coins</h2>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
