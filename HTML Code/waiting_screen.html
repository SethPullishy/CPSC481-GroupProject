<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="top-bar">
    
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span>Brentwood Station</span>

      <div class="weather-mini">
        <iframe src="https://widgets.commoninja.com/iframe/d0542a0e-2b72-4421-9c7d-d52b9fb80201" 
                width="760" 
                height="165" 
                frameborder="0" 
                scrolling="no">
        </iframe>
      </div>
    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
      const date = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
      
      // --- UPDATED: Use innerHTML to create a new line (<br>) ---
      // Puts Date on top, Time on bottom
      document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <div class="hero-container">
    <a href="../HTML Code/home_screen.html">
      <img src="../images/calgary_downtown.png" alt="Calgary Downtown">
    </a>
  </div>

  <div class="main-row">
    <div class="left-column">
      <div class="side-bar">
        <a href="../HTML Code/check_route_screen.html" class="side-bar-option">
          <img src="../images/route_icon.png" alt="Route Icon">
          <h3>ROUTE</h3>
        </a>

        <a href="../HTML Code/schedule_screen.html" class="side-bar-option">
          <img src="../images/schedule_icon.png" alt="Schedule Icon">
          <h3>SCHEDULE</h3>
        </a>

        <a href="../HTML Code/help_screen.html" class="side-bar-option">
          <img src="../images/help_icon.png" alt="Help Icon">
          <h3>HELP</h3>
        </a>

        <a href="../HTML Code/language_screen.html" class="side-bar-option">
          <img src="../images/language_icon.png" alt="Language Icon">
          <h3>FR ∇</h3>
        </a>
      </div>

      <img src="../images/traintime.png" class="train-time-img" alt="Train Times">
    </div>

    <div class="right-column">
      <img src="../images/waiting_bus_inf.png" alt="Bus Info">
    </div>
  </div>

  <img src="../images/news.png" class="news-banner" alt="News banner">
</body>
</html>
