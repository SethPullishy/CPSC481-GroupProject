<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="payment-page">

  <div class="top-bar">
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span data-i18n="location.brentwood">Brentwood Station</span>

      <div class="weather-mini">
  <div id="ww_cc758efd500b8" 
       v="1.3" 
       loc="id" 
       a='{"t":"horizontal","lang":"en","sl_lpl":1,"ids":["wl3002"],
           "font":"Arial","sl_ics":"one_a","sl_sot":"celsius",
           "cl_bkg":"#FFFFFF00","cl_font":"rgba(255,255,255,1)",
           "cl_cloud":"#d4d4d4","cl_persp":"#2196F3",
           "cl_sun":"#FFC107","cl_moon":"#FFC107",
           "cl_thund":"#FF5722","el_nme":3,"el_phw":3,"el_whr":3}'>
    More forecasts: 
    <a href="https://oneweather.org/calgary/30_days/" 
       id="ww_cc758efd500b8_u" target="_blank">
       Calgary weather 30 days
    </a>
  </div>
  <script async src="https://app3.weatherwidget.org/js/?id=ww_cc758efd500b8"></script>
</div>

    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <div class="payment-hero">
    <h1 class="payment-title" data-i18n="payment.header">How Would You Like To Pay?</h1>
  </div>

  <div class="payment-layout">

    <!-- Side bar -->
    <div class="ticket-side-bar">
      <a href="../HTML Code/home_screen.html" class="ticket-side-option">
        <img src="../images/home_icon.png" alt="Home Icon">
        <h3 data-i18n="sidebar.home">HOME</h3>
      </a>

      <a href="../HTML Code/check_route_screen.html" class="ticket-side-option">
        <img src="../images/route_icon.png" alt="Route Icon">
        <h3 data-i18n="sidebar.route">MAP</h3>
      </a>

      <a href="../HTML Code/schedule_screen.html" class="ticket-side-option">
        <img src="../images/schedule_icon.png" alt="Schedule Icon">
        <h3 data-i18n="sidebar.schedule">SCHEDULE</h3>
      </a>

      <a href="../HTML Code/help_screen.html" class="ticket-side-option">
        <img src="../images/help_icon.png" alt="Help Icon">
        <h3 data-i18n="sidebar.help">HELP</h3>
      </a>

      <button id="lang-toggle" class="ticket-side-option">
        <img src="../images/language_icon.png" alt="Language Icon">
        <h3 data-i18n="sidebar.lang"></h3>
      </button>

      <a onclick="history.back()" class="ticket-side-option">
        <img src="../images/back_icon.png" alt="Back Icon">
        <h3 data-i18n="sidebar.previous">PREVIOUS</h3>
      </a>
    </div>

    <div class="payment-content">

      <div class="cart-card">
        <h2 class="cart-title" data-i18n="payment.cart">Your Cart</h2>

        <div class="cart-table-wrap">
          <table class="cart-table">
            <thead>
              <tr>
                <th>QTY</th>
                <th data-i18n="payment.item">ITEM</th>
                <th data-i18n="payment.unit">UNIT</th>
                <th data-i18n="payment.cost">COST</th>
              </tr>
            </thead>
            <tbody id="cart-body"></tbody>
            <tfoot>
              <tr class="cart-total-row">
                <td id="total-qty">0</td>
                <td colspan="2" data-i18n="payment.totalcost">Total Cost</td>
                <td id="total-cost">$0.00</td>
              </tr>
            </tfoot>
          </table>

          <div id="empty-cart" class="empty-cart" style="display:none;" data-i18n="payment.empty">
            No tickets selected yet.
          </div>
        </div>
        <button id="clear-cart" class="clear-button" data-i18n="payment.clearcart">
        CLEAR CART
        </button>

        <a href="ticket_screen.html" class="return-button" data-i18n="payment.return">
        RETURN TO TICKET SELECTION
        </a>
      </div>

      <div class="payment-options">
        <a href="card_screen.html" class="pay-button" data-i18n="payment.card">
          Credit/Debit Card
        </a>

        <a href="cash_coin_screen.html" class="pay-button" data-i18n="payment.cash">
          Cash/Coins
        </a>
      </div>

    </div>
  </div>

  <script>
    const ITEMS = [
      { key: "adult-single",  label: "Adult Single Ticket",  price: 3.80 },
      { key: "adult-day",     label: "Adult Day Ticket",     price: 11.95 },
      { key: "adult-monthly", label: "Adult Monthly Pass",   price: 118.00 },
      { key: "youth-single",  label: "Youth Single Ticket",  price: 2.55 },
      { key: "youth-day",     label: "Youth Day Ticket",     price: 8.75 },
      { key: "youth-monthly", label: "Youth Monthly Pass",   price: 86.00 }
    ];

    function getCount(key) {
      return parseInt(localStorage.getItem(key) || "0");
    }

    const bodyEl = document.getElementById("cart-body");
    const totalQtyEl = document.getElementById("total-qty");
    const totalCostEl = document.getElementById("total-cost");
    const emptyEl = document.getElementById("empty-cart");

    function renderCart() {
      bodyEl.innerHTML = "";
      let totalQty = 0;
      let totalCost = 0;
      let hasItems = false;

      ITEMS.forEach(item => {
        const qty = getCount(item.key);
        if (qty > 0) {
          hasItems = true;
          const lineCost = qty * item.price;
          totalQty += qty;
          totalCost += lineCost;

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${qty}</td>
            <td>${item.label}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>$${lineCost.toFixed(2)}</td>
          `;
          bodyEl.appendChild(tr);
        }
      });

      totalQtyEl.textContent = totalQty;
      totalCostEl.textContent = `$${totalCost.toFixed(2)}`;

      emptyEl.style.display = hasItems ? "none" : "block";
    }

    renderCart();
    document.getElementById("clear-cart").addEventListener("click", () => {
    ITEMS.forEach(item => localStorage.removeItem(item.key));
    renderCart();
    });
  </script>
  <script src="translate.js"></script>

</body>
</html>
