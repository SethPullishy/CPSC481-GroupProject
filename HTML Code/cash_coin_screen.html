<div style="position: relative; margin-left: 42%;" class="planner-row">
  <div>

  </div>
  <div>

  </div>

      <p>$2.00</p>

      <div>
      <img class="cash-cash" src="../images/Cash.png" alt="Calgary Logo">
      <p>$5,10,20,50,100</p>
  </div>
</div>

  <script>
  const ITEMS = [
    { key: "adult-single",  price: 3.80 },
    { key: "adult-day",     price: 11.95 },
    { key: "adult-monthly", price: 118.00 },
    { key: "youth-single",  price: 2.55 },
    { key: "youth-day",     price: 8.75 },
    { key: "youth-monthly", price: 86.00 }
  ];

  function getCount(key) {
    return parseInt(localStorage.getItem(key) || "0");
  }

  function calcTotal() {
    let total = 0;
    ITEMS.forEach(item => {
      total += item.price * getCount(item.key);
    });
    return total;
  }

  const DENOMS = [0.05, 0.10, 0.25, 1, 2, 5, 10, 20];

  let balance = calcTotal();
  const balanceEl = document.getElementById("balance-due");

  function renderBalance() {
    balanceEl.textContent = `$${balance.toFixed(2)}`;
  }

  renderBalance();

  document.getElementById("cash-card").addEventListener("click", () => {
    const inserted = DENOMS[Math.floor(Math.random() * DENOMS.length)];
    balance = Math.max(0, balance - inserted);
    renderBalance();

    if (balance <= 0) {
      window.location.href = "../HTML Code/payment_error_screen.html";
    }
  });
</script>
<script src="translate.js"></script>

</body>
</html>
