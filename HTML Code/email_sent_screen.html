<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Sent</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="email-sent-page">

  <!-- Top bar -->
  <div class="top-bar">
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span>Brentwood Station</span>

      <div class="weather-mini">
        <iframe
          src="https://widgets.commoninja.com/iframe/d0542a0e-2b72-4421-9c7d-d52b9fb80201"
          width="760"
          height="165"
          frameborder="0"
          scrolling="no">
        </iframe>
      </div>
    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour:'2-digit', minute:'2-digit', hour12:true
      });
      const date = now.toLocaleDateString('en-US', {
        weekday:'long', month:'long', day:'numeric'
      });
      document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <div class="email-sent-hero">
    <h1 class="email-sent-title">Receipt Email</h1>
  </div>

  <div class="email-sent-layout">

    <!-- Side bar -->
    <div class="ticket-side-bar">
      <a href="../HTML Code/home_screen.html" class="ticket-side-option">
        <img src="../images/home_icon.png">
        <h3>HOME</h3>
      </a>

      <a href="../HTML Code/check_route_screen.html" class="ticket-side-option">
        <img src="../images/route_icon.png">
        <h3>ROUTE</h3>
      </a>

      <a href="../HTML Code/schedule_screen.html" class="ticket-side-option">
        <img src="../images/schedule_icon.png">
        <h3>SCHEDULE</h3>
      </a>

      <a href="../HTML Code/help_screen.html" class="ticket-side-option">
        <img src="../images/help_icon.png">
        <h3>HELP</h3>
      </a>

      <a href="../HTML Code/language_screen.html" class="ticket-side-option">
        <img src="../images/language_icon.png">
        <h3>FR ∇</h3>
      </a>

      <a onclick="history.back()" class="ticket-side-option">
        <img src="../images/back_icon.png">
        <h3>PREVIOUS</h3>
      </a>
    </div>

    <!-- Main Content -->
    <div class="email-sent-center">
      <a href="../HTML Code/thank_you_screen.html" class="email-sent-card-link">
        <div class="email-sent-card">
          <h1>Email sent</h1>
          <p>Check your inbox</p>
          <p class="email-sent-sub">Tap anywhere to continue</p>
        </div>
      </a>
    </div>

  </div>

</body>
</html>
