<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Error</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="payment-error-page">

  <div class="top-bar">
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span>Brentwood Station</span>

      <div class="weather-mini">
        <iframe
          src="https://widgets.commoninja.com/iframe/d0542a0e-2b72-4421-9c7d-d52b9fb80201"
          width="760"
          height="165"
          frameborder="0"
          scrolling="no">
        </iframe>
      </div>
    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour:'2-digit', minute:'2-digit', hour12:true
      });
      const date = now.toLocaleDateString('en-US', {
        weekday:'long', month:'long', day:'numeric'
      });
      document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <div class="payment-error-hero">
    <h1 class="payment-error-title">
  Payment <span class="error-word">Error</span>
</h1>
  </div>

  <div class="payment-error-layout">

    <div class="ticket-side-bar">
      <a href="../HTML Code/home_screen.html" class="ticket-side-option">
        <img src="../images/home_icon.png" alt="Home Icon">
        <h3>HOME</h3>
      </a>

      <a href="../HTML Code/check_route_screen.html" class="ticket-side-option">
        <img src="../images/route_icon.png" alt="Route Icon">
        <h3>ROUTE</h3>
      </a>

      <a href="../HTML Code/schedule_screen.html" class="ticket-side-option">
        <img src="../images/schedule_icon.png" alt="Schedule Icon">
        <h3>SCHEDULE</h3>
      </a>

      <a href="../HTML Code/help_screen.html" class="ticket-side-option">
        <img src="../images/help_icon.png" alt="Help Icon">
        <h3>HELP</h3>
      </a>

      <a href="../HTML Code/language_screen.html" class="ticket-side-option">
        <img src="../images/language_icon.png" alt="Language Icon">
        <h3>FR ∇</h3>
      </a>

      <a onclick="history.back()" class="ticket-side-option">
        <img src="../images/back_icon.png" alt="Back Icon">
        <h3>PREVIOUS</h3>
      </a>
    </div>

    <main class="payment-error-center">
      <div class="payment-error-card">
        <h1>There has been an error your payment</h1>        <p>Please return to the payment screen and try again.</p>
      </div>
    </main>

  </div>

  <div class="adult-bottom-bar error-bottom-bar">
    <a href="../HTML Code/payment_screen.html" class="adult-bottom-option error-bottom-option">
      <img src="../images/back_icon.png" alt="Back Icon">
      <h3>Return to Payment Screen</h3>
    </a>
  </div>

</body>
</html>
