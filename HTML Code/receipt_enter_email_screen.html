      <span>Brentwood Station</span>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
      const date = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <!-- Title -->
  <div class="receipt-email-hero">
    <h1 class="receipt-email-title">Please type in your email</h1>
  </div>

  <!-- Layout -->
  <div class="receipt-email-layout">

    <!-- Side bar -->
    <div class="ticket-side-bar">

      <a href="../HTML Code/home_screen_fr.html" class="ticket-side-option">

    <!-- Main content -->
    <div class="receipt-email-content">
      <div class="receipt-email-card">

        <label for="email" class="receipt-email-label">Enter Email:</label>
        <input
          type="text"
          id="email"
          name="email"
          class="receipt-email-input"
          placeholder="example@email.ca"
          autocomplete="off"
        >

        <img src="../images/keyboard.png" alt="On-screen keyboard" class="receipt-email-keyboard">

        <a href="../HTML Code/email_sent_screen.html" class="receipt-email-submit">
