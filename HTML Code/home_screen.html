<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Home Screen</title>
    </head>

    <body>
        <div class="top-bar">
            <img src="../images/yyc_logo.png" alt="Calgary Logo">
            <img src="../images/map_icon.png" alt="Map Pin Icon">
            <h3 class="top-bar-text">Brentwood Station</h3>
            <h3 class="top-bar-text">12:55 PM Friday, October 31</h3> 
        </div>


        <div class="title-level">
            <h1>Welcome,</h1>
            <img src="../images/weather_icon.png">
            <h1>What would you like to do today?</h1>
        </div>


        <div class="main-actions">
            <a href="../HTML Code/ticket_screen.html" class="large-button-container">
                <h2>Buy Tickets</h2>
                <ul>
                    <li>Single Ticket</li>
                    <li>Day Pass</li>
                    <li>Monthly Pass</li>
                </ul>
            </a>

            <a href="../HTML Code/check_route_screen.html" class="large-button-container">
                <h2>Check Route</h2>
                <ul>
                    <li>Find out which route you need to take</li>
                </ul>
            </a>

            <a href="../HTML Code/schedule_screen.html" class="large-button-container">
                <h2>Check Bus and Train Timings</h2>
                <ul>
                    <li>Find out when your bus is arriving</li>
                </ul>
            </a>
        </div>


        <div class="bottom-bar">
            <a href="../HTML Code/short_cut_1_screen.html">
                <div class="large-button-container">
                    <h2>1 Adult Ticket</h2>
                </div>
            </a>
        </div>
    </body>
</html>
