<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="home-page">
  <div class="top-bar">
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span>Brentwood Station</span>

      <div class="weather-mini">
        <iframe src="https://widgets.commoninja.com/iframe/d0542a0e-2b72-4421-9c7d-d52b9fb80201" 
                width="760" 
                height="165" 
                frameborder="0" 
                scrolling="no">
        </iframe>
      </div>
    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        // Seconds removed
        hour12: true
      });
      const date = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
      
      document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <div class="home-hero">
    <div class="title-level">
      <h1 class="welcome-title">Welcome</h1>
      <h1 class="welcome-subtitle">What would you like to do today?</h1>
    </div>
  </div>

  <div class="main-actions">
    <a href="../HTML Code/ticket_screen.html" class="large-button-container">
      <img src="../images/total_icon.png" alt="Ticket Icon">
      <h2>Buy Tickets</h2>
      <ul>
        <li>  Single Ticket</li>
        <li>  Day Pass</li>
        <li>  Monthly Pass</li>
      </ul>
    </a>

    <a href="../HTML Code/check_route_screen.html" class="large-button-container">
      <img src="../images/route_icon.png" alt="Route Icon">
      <h2>Check Route</h2>
      <ul>
        <li>  Find out which route you need to take</li>
      </ul>
    </a>

    <a href="../HTML Code/schedule_screen.html" class="large-button-container">
      <img src="../images/schedule_icon.png" alt="Schedule Icon">
      <h2>Check Timings</h2>
      <ul>
        <li>  Find out when your bus is arriving</li>
      </ul>
    </a>
  </div>

  <div class="bottom-bar">
    <a href="../HTML Code/short_cut_1_screen.html" class="bottom-bar-button">
      <h2>Quick Buy: 1 Adult Ticket</h2>
    </a>
  </div>
</body>
</html>
