<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body class="home-page">

  
  <div class="top-bar">
    
    <div class="top-left">
      <img src="../images/yyc_logo.png" alt="Calgary Logo">
    </div>

    <div class="top-center">
      <img src="../images/map_icon.png" alt="Map Pin Icon" width="50">
      <span data-i18n="location.brentwood">Brentwood Station</span>

      <div class="weather-mini">
        <div id="ww_cc758efd500b8" 
             v='1.3' 
             loc='id' 
             a='{"t":"horizontal","lang":"en","sl_lpl":1,"ids":["wl3002"],"font":"Arial","sl_ics":"one_a","sl_sot":"celsius","cl_bkg":"#FFFFFF00","cl_font":"rgba(255,255,255,1)","cl_cloud":"#d4d4d4","cl_persp":"#2196F3","cl_sun":"#FFC107","cl_moon":"#FFC107","cl_thund":"#FF5722","el_nme":3,"el_phw":3,"el_whr":3}'>
            More forecasts: <a href="https://oneweather.org/calgary/30_days/" id="ww_cc758efd500b8_u" target="_blank">Calgary weather 30 days</a>
        </div>
        <script async src="https://app3.weatherwidget.org/js/?id=ww_cc758efd500b8"></script>
      </div>
    </div>

    <div class="top-right" id="datetime"></div>
  </div>

  <div class="home-hero">
    <div class="title-level">
      <h1 class="welcome-title" data-i18n="home.welcome">Welcome</h1>
      <h1 class="welcome-subtitle" data-i18n="home.question">What would you like to do today?</h1>
    </div>
  </div>

  <div class="main-actions">
    <a href="../HTML Code/ticket_screen.html" class="large-button-container">
      <img src="../images/total_icon.png" alt="Ticket Icon">
      <h2 data-i18n="home.buytickets">Buy Tickets</h2>
      <ul>
        <li data-i18n="home.singleticket">  Single Ticket</li>
        <li data-i18n="home.daypass">  Day Pass</li>
        <li data-i18n="home.monthpass">  Monthly Pass</li>
      </ul>
    </a>

    <a href="../HTML Code/check_route_screen.html" class="large-button-container">
      <img src="../images/route_icon.png" alt="Route Icon">
      <h2 data-i18n="home.map"> Map</h2>
      <ul>
        <li data-i18n="home.maptext"> View Map </li>
      </ul>
    </a>

    <a href="../HTML Code/schedule_screen.html" class="large-button-container">
      <img src="../images/schedule_icon.png" alt="Schedule Icon">
      <h2 data-i18n="home.checksched">Check Timings</h2>
      <ul>
        <li data-i18n="home.checktext">  Find out when your bus is arriving</li>
      </ul>
    </a>
  </div>

  <div class="bottom-bar">
  <a href="../HTML Code/payment_screen.html" 
     class="large-button-container" 
     id="quick-buy-1-adult">
    <h2 data-i18n="home.shortcut">Quick Buy: 1 Adult Ticket</h2>
  </a>
</div>

<script>
  // keys you used for tickets
  const TICKET_KEYS = [
    "adult-single",
    "adult-day",
    "adult-monthly",
    "youth-single",
    "youth-day",
    "youth-monthly"
  ];

  window.addEventListener("DOMContentLoaded", () => {
    // clear all ticket counts when home loads
    TICKET_KEYS.forEach(key => localStorage.removeItem(key));

    // wire up quick buy
    const quick = document.getElementById("quick-buy-1-adult");
    if (quick) {
      quick.addEventListener("click", (e) => {
        e.preventDefault();                      // stop normal link behavior
        localStorage.setItem("adult-single", "1"); // set 1 adult single
        window.location.href = "../HTML Code/payment_screen.html";
      });
    }
  });
</script>
  <script src="translate.js"></script>
</body>
</html>
