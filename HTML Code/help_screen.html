  <script>
    function updateClock() {
      const now = new Date();
      const time = now.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit',
        hour12: true
      });
      const date = now.toLocaleDateString('en-US', {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      });
      document.getElementById('datetime').innerHTML = `${date}<br>${time}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
  </script>

  <script>
    const headers = document.querySelectorAll(".accordion-card-header");

    headers.forEach(header => {
      header.addEventListener("click", () => {
        const content = header.nextElementSibling;
        const icon = header.querySelector(".icon");

        // Close others (optional - remove this loop if you want multiple open)
        document.querySelectorAll(".accordion-card-content").forEach(item => {
          if (item !== content) {
            item.style.display = "none";
            item.previousElementSibling.querySelector(".icon").classList.remove("toggleIcon");
          }
        });

        // Toggle current
        if (content.style.display === "block") {
          content.style.display = "none";
          icon.classList.remove("toggleIcon");
        } else {
          content.style.display = "block";
          icon.classList.add("toggleIcon");
        }
      });
    });
  </script>
